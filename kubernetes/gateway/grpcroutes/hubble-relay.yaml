apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: hubble-relay
  namespace: kube-system
spec:
  parentRefs:
    - name: gateway-internal
      namespace: gateway
      sectionName: https
  hostnames:
    - hubble-relay.internal.homelab0.xyz
  rules:
    - backendRefs:
        - name: hubble-relay
          port: 80
